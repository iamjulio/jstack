name: Validate skills
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate catalog and references
        run: python3 scripts/jstack.py check
      - name: Exercise installer and packaging
        run: python3 -m unittest discover -s tests -v
      - name: Exercise media helper without model downloads
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python3 -m unittest discover -s skills/ad-buying/scripts -p 'test_*.py' -v
      - name: Build skill bundles
        run: python3 scripts/jstack.py bundle --all
